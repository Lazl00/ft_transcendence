version: '3.8'

services:
  nginx:
    build: ./srcs/nginx
    container_name: nginx
    restart: unless-stopped
    ports:
      - "8080:443"
    networks:
      - internal-network

  database:
    image: postgres:16-alpine
    restart: unless-stopped
    container_name: database-sql
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    networks:
      - internal-network
    volumes:
      - postgresql_data:/var/lib/postgresql/data
      - ./srcs/back-end/postgresql:/docker-entrypoint-initdb.d:ro

  back-end:
    build: ./srcs/back-end
    restart: unless-stopped
    container_name: back-end
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    depends_on:
      - database
    ports:
      - "3000:3000"
    networks:
      - internal-network

volumes:
  postgresql_data:

networks:
  internal-network:
    driver: bridge