version: '3.8'

services:
  nginx:
    build: ./srcs/nginx
    container_name: nginx
    restart: unless-stopped
    ports:
      - "8080:443"
    networks:
      - internal-network

  database:
    image: postgres:16-alpine
    restart: unless-stopped
    container_name: database-sql
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    networks:
      - internal-network
    volumes:
      - postgresql_data:/var/lib/postgresql/data
      - ./srcs/back-end/postgresql:/docker-entrypoint-initdb.d:ro

volumes:
  postgresql_data:

networks:
  internal-network:
    driver: bridge