version: '3.8'

services:
  nginx:
    build: ./srcs/nginx
    container_name: nginx
    restart: unless-stopped
    ports:
      - "8080:443"
    networks:
      - internal-network

  database:
    image: postgres:16-alpine
    restart: unless-stopped
    container_name: database-sql
    environment:
      POSTGRES_USER: demo_user
      POSTGRES_PASSWORD: demo_password
      POSTGRES_DB: demo_db
    networks:
      - internal-network
    volumes:
      - postgresql_data:/var/lib/postgressql/data

volumes:
  postgresql_data:



networks:
  internal-network:
    driver: bridge